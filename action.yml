name: MEGA DataGate validation
description: Validate a local dataset against a DataGate contract and upload a value-free report.
author: MEGA DataGate contributors
inputs:
  input:
    description: Path to CSV, TSV, JSONL, or NDJSON in the checked-out workspace.
    required: true
  contract:
    description: Path to a datagate-contract/v1 JSON file.
    required: true
  report-directory:
    description: Directory for JSON and HTML validation artifacts.
    required: false
    default: .datagate/validation
  python-version:
    description: Python version used by the action.
    required: false
    default: "3.13"
outputs:
  valid:
    description: "true when the input passes the contract; otherwise false."
    value: ${{ steps.validate.outputs.valid }}
  issue-count:
    description: Number of contract violations found.
    value: ${{ steps.validate.outputs.issue_count }}
  report-directory:
    description: Directory containing validation.json and report.html.
    value: ${{ inputs.report-directory }}
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install DataGate
      shell: bash
      env:
        DATA_GATE_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$DATA_GATE_ACTION_PATH"
    - name: Validate dataset
      id: validate
      shell: bash
      env:
        DATA_GATE_INPUT: ${{ inputs.input }}
        DATA_GATE_CONTRACT: ${{ inputs.contract }}
        DATA_GATE_REPORT_DIR: ${{ inputs.report-directory }}
      run: |
        set +e
        datagate validate "$DATA_GATE_INPUT" \
          --contract "$DATA_GATE_CONTRACT" \
          --out "$DATA_GATE_REPORT_DIR"
        result=$?
        set -e
        if [ "$result" -eq 2 ]; then
          echo "valid=false" >> "$GITHUB_OUTPUT"
          echo "issue_count=-1" >> "$GITHUB_OUTPUT"
          exit 2
        fi
        if [ ! -f "$DATA_GATE_REPORT_DIR/validation.json" ]; then
          echo "valid=false" >> "$GITHUB_OUTPUT"
          echo "issue_count=-1" >> "$GITHUB_OUTPUT"
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit "$result"
        fi
        export DATA_GATE_RESULT_FILE="$DATA_GATE_REPORT_DIR/validation.json"
        python - <<'PY'
        import json, os
        with open(os.environ["DATA_GATE_RESULT_FILE"], encoding="utf-8") as handle:
            report = json.load(handle)
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write(f"valid={str(report['valid']).lower()}\n")
            output.write(f"issue_count={report['issue_count']}\n")
            output.write(f"exit_code={int(report['valid'] is False)}\n")
        PY
    - name: Upload DataGate report
      if: always() && hashFiles(format('{0}/validation.json', inputs.report-directory)) != ''
      uses: actions/upload-artifact@v7.0.2
      with:
        name: datagate-validation-report
        path: ${{ inputs.report-directory }}
        if-no-files-found: warn
    - name: Fail job when contract is not satisfied
      if: steps.validate.outputs.valid == 'false'
      shell: bash
      run: exit 1
